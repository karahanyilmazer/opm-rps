# Analysis configuration of the OPM rock-paper-scissors project.
#
# Machine-specific paths (where the raw data and the MRI live) are not set here
# but in a `.env` file at the repository root, see the README.

# --- Dataset ------------------------------------------------------------------
subject: '11766'     # participant = FreeSurfer subject name of the MRI segmentation
session: '20230623'  # recording date

# Layout of the data folder that OPM_RPS_DATA_DIR (.env) points to: the dataset
# folder from Nottingham (2023-06-21_nottingham), with one folder per session
raw_subdir: ''
mri_subdir: MRI/Segmentation

# Start time (HHMMSS) of each cMEG acquisition of the session
acquisitions:
  noise_1: '095228'
  noise_2: '100008'
  noise_3: '100245'
  run_1: '102814'
  run_2: '104104'
  run_3: '105342'  # also contains the beginning of run 4, see `crop`
  run_4: '110808'
  rest: '112029'

runs: [run_1, run_2, run_3, run_4]  # task runs
events: [roc, pap, sci]             # conditions, see opm_rps.io.EVENT_ID

# Sensor above the motor cortex used for the single-channel ERP/TF analyses
roi_sensor: KB

# --- Preprocessing ------------------------------------------------------------
hfc_order: 2                 # homogeneous field correction
detrend: 1                   # linear detrending of each epoch
epoch_window: [-0.5, 2.1]    # tmin, tmax (s) around the cue
tf_baseline: [-0.45, -0.15]  # baseline (s) for the dB normalisation of TF power

# Crop runs to [tmin, tmax] (s)
crop:
  run_3: [0, 681]  # the rest of run 3 is the beginning of run 4

# Notch filter: the 50 Hz line noise and its harmonics up to 550 Hz are always
# removed; these are additional sensor-specific peaks (broadband features only)
notch_freqs: [227, 277.15, 473]

# Pass bands (Hz)
broadband: [1, 400]     # MNE band-pass of the feature matrices
decoding_band: [7, 30]  # least-squares FIR band-pass of the cleaned decoding epochs

# --- Source space -------------------------------------------------------------
# MEG-MRI coregistration: the head -> MRI transform of the forward model (see
# scripts/source_space/coregister.py). The head frame is the frame into which the
# SensorTransform sidecar maps the helmet; the identity if no coregistration was
# saved at acquisition.
#   identity     none: the head frame is taken as the MRI frame, so the source
#                estimates are not anatomically aligned ("misaligned" file names)
#   scanner_ras  the head frame is the scanner RAS frame of the MRI (a helmet
#                designed on the MRI, or a SensorTransform into the MRI), which the
#                header of T1.mgz converts to FreeSurfer's surface RAS frame
# 11766 wore a helmet designed on the MRI; all SensorTransforms are the identity
# and every sensor lies 5-24 mm outside the scalp (coregister.py)
coregistration: scanner_ras

# --- Bad channels and trials --------------------------------------------------
# Inspection notes:
# Run 1: bad LN[X, Y, Z], FZ[X], K9[X], KF[Y], MU[Z], FR[Z]
#        suspicious FR[X, Y], LB[X, Y], HJ[X], HF[Y], KD[Y], KB[Z]
# Run 2: bad LN[X, Y, Z], MV[X, Y, Z], LB[X, Y], FZ[X], K9[X], HF[Y], KC[Y], KF[Y], MU[Z]
#        suspicious G0[X], HJ[X], LF[X], K9[Y], KC[Z]
