[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opm-rps"
version = "0.1.0"
authors = [{ name = "Karahan Yilmazer" }]
description = "Rock-paper-scissors gesture decoding from optically pumped magnetometer (OPM) MEG data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scienceplots>=2.2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
sweep = [
    "wandb>=0.31.0",
]
viz3d = [
    "imageio-ffmpeg>=0.6.0",
    "nibabel>=5.4.2",
    "pyside6>=6.12.0",
    "pyvista>=0.49.1",
    "pyvistaqt>=0.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opm_rps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
